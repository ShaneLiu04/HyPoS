<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="0.55" stop-color="#0b1e33"/>
      <stop offset="1" stop-color="#0a2630"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2036"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7dd3fc" fill-opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>
  <rect x="96" y="118" width="3" height="330" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <!-- 2x2 domain-decomposition mosaic -->
  <g transform="translate(1010,380)">
    <circle r="205" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 8" opacity="0.9"/>
    <text x="0" y="-206" text-anchor="middle" font-size="34" font-style="italic"
          font-family="'Cambria Math','Times New Roman',serif" fill="#e2e8f0">&#8711;&#178;u = f</text>

    <!-- halo bands -->
    <rect x="-13" y="-161" width="26" height="148" fill="url(#accent)" opacity="0.22" filter="url(#haloGlow)"/>
    <rect x="-13" y="13" width="26" height="148" fill="url(#accent)" opacity="0.22" filter="url(#haloGlow)"/>
    <rect x="-161" y="-13" width="148" height="26" fill="url(#accent)" opacity="0.22" filter="url(#haloGlow)"/>
    <rect x="13" y="-13" width="148" height="26" fill="url(#accent)" opacity="0.22" filter="url(#haloGlow)"/>

    <!-- tiles -->
    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
      <g>
        <rect x="-161" y="-161" width="148" height="148" rx="12" fill="url(#tile)" stroke="#22d3ee" stroke-opacity="0.7"/>
        <rect x="-155" y="-155" width="136" height="136" rx="9" fill="url(#dots)"/>
        <text x="-147" y="-141" font-size="15" fill="#67e8f9">P0</text>
      </g>
      <g>
        <rect x="13" y="-161" width="148" height="148" rx="12" fill="url(#tile)" stroke="#818cf8" stroke-opacity="0.7"/>
        <rect x="19" y="-155" width="136" height="136" rx="9" fill="url(#dots)"/>
        <text x="27" y="-141" font-size="15" fill="#c7d2fe">P1</text>
      </g>
      <g>
        <rect x="-161" y="13" width="148" height="148" rx="12" fill="url(#tile)" stroke="#818cf8" stroke-opacity="0.7"/>
        <rect x="-155" y="19" width="136" height="136" rx="9" fill="url(#dots)"/>
        <text x="-147" y="33" font-size="15" fill="#c7d2fe">P2</text>
      </g>
      <g>
        <rect x="13" y="13" width="148" height="148" rx="12" fill="url(#tile)" stroke="#22d3ee" stroke-opacity="0.7"/>
        <rect x="19" y="19" width="136" height="136" rx="9" fill="url(#dots)"/>
        <text x="27" y="33" font-size="15" fill="#67e8f9">P3</text>
      </g>
    </g>
    <text x="0" y="238" text-anchor="middle" font-size="16"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#94a3b8">2&#215;2 domain decomposition &#183; halo exchange</text>
  </g>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="96" y="205" font-size="116" font-weight="800" fill="url(#title)" filter="url(#soft)">HyPoS</text>
    <text x="98" y="252" font-size="28" font-weight="600" fill="#cbd5e1"
          textLength="288" lengthAdjust="spacingAndGlyphs">Hybrid Poisson Solver</text>
    <text x="98" y="288" font-size="19" fill="#94a3b8"
          textLength="470" lengthAdjust="spacingAndGlyphs">MPI + OpenMP &#183; Distributed Poisson Solver &#183; C++17</text>
    <text x="98" y="320" font-size="18" fill="#7dd3fc"
          textLength="302" lengthAdjust="spacingAndGlyphs">面向 AI Infra 的高性能分布式计算</text>

    <g font-size="16" fill="#e2e8f0">
      <rect x="98" y="348" rx="15" width="80" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="138" y="369" text-anchor="middle">C++17</text>
      <rect x="188" y="348" rx="15" width="62" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="219" y="369" text-anchor="middle">MPI</text>
      <rect x="260" y="348" rx="15" width="98" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="309" y="369" text-anchor="middle">OpenMP</text>
      <rect x="368" y="348" rx="15" width="84" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="410" y="369" text-anchor="middle">CMake</text>
      <rect x="462" y="348" rx="15" width="52" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="488" y="369" text-anchor="middle">CI</text>
    </g>

    <g font-size="16">
      <rect x="98" y="398" rx="14" width="560" height="38" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.55"/>
      <circle cx="120" cy="417" r="4" fill="#22d3ee"/>
      <text x="136" y="423" fill="#a5f3fc"
            textLength="500" lengthAdjust="spacingAndGlyphs">Performance: iter_time &#8722;37.5% (np=1) &#183; &#8722;39.0% (np=4)</text>

      <rect x="98" y="446" rx="14" width="560" height="38" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.55"/>
      <circle cx="120" cy="465" r="4" fill="#818cf8"/>
      <text x="136" y="471" fill="#c7d2fe"
            textLength="430" lengthAdjust="spacingAndGlyphs">Halo exchange: P2P &#183; Datatype &#183; True Collective</text>

      <rect x="98" y="494" rx="14" width="560" height="38" fill="#0f2a23" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="120" cy="513" r="4" fill="#34d399"/>
      <text x="136" y="519" fill="#a7f3d0"
            textLength="430" lengthAdjust="spacingAndGlyphs">Solvers: Jacobi &#183; Red-Black GS &#183; CG &#183; ctest 35/35</text>
    </g>

    <text x="98" y="598" font-size="15" fill="#64748b"
          textLength="560" lengthAdjust="spacingAndGlyphs">ShaneLiu04 &#183; github.com/ShaneLiu04/HyPoS &#183; gitee.com/liu-xingyan04/hy-po-s</text>
  </g>
</svg>
