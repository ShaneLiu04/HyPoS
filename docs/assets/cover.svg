<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="0.55" stop-color="#0a1c2e"/>
      <stop offset="1" stop-color="#07222b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <rect x="80" y="118" width="4" height="300" rx="2" fill="url(#accent)" opacity="0.85"/>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="96" y="212" font-size="118" font-weight="800"
          fill="url(#title)" filter="url(#soft)">HyPoS</text>
    <text x="106" y="262" font-size="30" font-weight="600" fill="#cbd5e1"
          textLength="300" lengthAdjust="spacingAndGlyphs">Hybrid Poisson Solver</text>
    <text x="106" y="300" font-size="20" fill="#94a3b8"
          textLength="500" lengthAdjust="spacingAndGlyphs">MPI + OpenMP &#183; C++17 &#183; 2D/3D domain decomposition</text>
    <text x="106" y="334" font-size="19" fill="#7dd3fc"
          textLength="324" lengthAdjust="spacingAndGlyphs">面向 AI Infra 的高性能分布式求解器</text>

    <g font-size="16" fill="#e2e8f0">
      <rect x="106" y="362" rx="15" width="80" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="146" y="383" text-anchor="middle">C++17</text>
      <rect x="196" y="362" rx="15" width="62" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="227" y="383" text-anchor="middle">MPI</text>
      <rect x="268" y="362" rx="15" width="98" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="317" y="383" text-anchor="middle">OpenMP</text>
      <rect x="376" y="362" rx="15" width="84" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="418" y="383" text-anchor="middle">CMake</text>
      <rect x="470" y="362" rx="15" width="52" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="496" y="383" text-anchor="middle">CI</text>
    </g>

    <g font-size="16">
      <rect x="106" y="414" rx="14" width="600" height="38" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.55"/>
      <circle cx="128" cy="433" r="4" fill="#22d3ee"/>
      <text x="144" y="439" fill="#a5f3fc"
            textLength="540" lengthAdjust="spacingAndGlyphs">iter_time &#8722;37.5% (np=1) &#183; &#8722;39.0% (np=4)</text>

      <rect x="106" y="462" rx="14" width="600" height="38" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.55"/>
      <circle cx="128" cy="481" r="4" fill="#818cf8"/>
      <text x="144" y="487" fill="#c7d2fe"
            textLength="530" lengthAdjust="spacingAndGlyphs">Solvers: Jacobi &#183; Red-Black GS &#183; Conjugate Gradient</text>

      <rect x="106" y="510" rx="14" width="600" height="38" fill="#0f2a23" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="128" cy="529" r="4" fill="#34d399"/>
      <text x="144" y="535" fill="#a7f3d0"
            textLength="545" lengthAdjust="spacingAndGlyphs">Quality: ctest 25/25 &#183; ASan/UBSan clean &#183; AR001&#8211;AR004 archived</text>
    </g>

    <text x="106" y="602" font-size="15" fill="#64748b"
          textLength="560" lengthAdjust="spacingAndGlyphs">ShaneLiu04 &#183; github.com/ShaneLiu04/HyPoS &#183; gitee.com/liu-xingyan04/hy-po-s</text>
  </g>

  <g transform="translate(1020,318)">
    <circle r="176" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 7"/>
    <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-92"/>
      <line x1="0" y1="0" x2="0" y2="92"/>
      <line x1="0" y1="0" x2="-92" y2="0"/>
      <line x1="0" y1="0" x2="92" y2="0"/>
    </g>
    <g>
      <circle cx="0" cy="-92" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="92" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-92" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="92" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="32" fill="url(#accent)" stroke="#e0f2fe" stroke-width="2"/>
    </g>
    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#7dd3fc" font-size="18">
      <text x="0" y="-92" dominant-baseline="central">u</text>
      <text x="0" y="92" dominant-baseline="central">u</text>
      <text x="-92" y="0" dominant-baseline="central">u</text>
      <text x="92" y="0" dominant-baseline="central">u</text>
    </g>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#06121f">u*</text>
    <text x="0" y="-134" text-anchor="middle" font-size="38" font-style="italic"
          font-family="'Cambria Math','Times New Roman',serif" fill="#e2e8f0">&#8711;&#178;u = f</text>
    <text x="0" y="152" text-anchor="middle" font-size="17"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#94a3b8">5-point stencil &#183; halo exchange</text>
  </g>
</svg>
